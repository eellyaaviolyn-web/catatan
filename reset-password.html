<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Web Catatan</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-sticky-note"></i> Web Catatan</h1>
                <p>Reset Password</p>
            </div>
            
            <div id="resetForm" class="auth-form active">
                <h2>Buat Password Baru</h2>
                <form onsubmit="handleResetPassword(event)">
                    <div class="form-group">
                        <input type="password" id="newPassword" placeholder="Password Baru" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmNewPassword" placeholder="Konfirmasi Password Baru" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button type="submit" class="btn-primary">Reset Password</button>
                </form>
                <div class="auth-links">
                    <a href="index.html">Kembali ke Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showMessage('Token reset tidak valid!', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }
            
            // Verify token
            const users = db.getUsers();
            const user = users.find(u => u.resetToken === token);
            
            if (!user) {
                showMessage('Token reset tidak valid atau sudah kedaluwarsa!', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }
            
            // Check if token is expired
            if (user.resetTokenExpiry && new Date() > new Date(user.resetTokenExpiry)) {
                showMessage('Token reset sudah kedaluwarsa!', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }
            
            // Store user ID for password reset
            window.resetUserId = user.id;
        });
        
        function handleResetPassword(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmPassword) {
                showMessage('Password tidak cocok!', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('Password minimal 6 karakter!', 'error');
                return;
            }
            
            if (!window.resetUserId) {
                showMessage('Terjadi kesalahan!', 'error');
                return;
            }
            
            // Update password
            db.updateUser(window.resetUserId, {
                password: newPassword,
                resetToken: null,
                resetTokenExpiry: null
            });
            
            showMessage('Password berhasil direset! Mengalihkan ke halaman login...', 'success');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
        
        function showMessage(message, type) {
            const existingMessages = document.querySelectorAll('.message');
            existingMessages.forEach(msg => msg.remove());
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            const form = document.getElementById('resetForm');
            form.insertBefore(messageDiv, form.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
