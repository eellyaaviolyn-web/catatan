<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - Web Catatan</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-sticky-note"></i> Web Catatan</h1>
                <p>Verifikasi OTP</p>
            </div>
            
            <div id="otpForm" class="auth-form active">
                <div class="otp-info">
                    <i class="fas fa-envelope-open" style="font-size: 48px; color: var(--primary-color); margin-bottom: 16px;"></i>
                    <h2>Masukkan Kode OTP</h2>
                    <p>Kami telah mengirim kode 6 digit ke email Anda</p>
                    <p id="emailDisplay" style="font-weight: 600; color: var(--primary-color);"></p>
                </div>
                
                <form onsubmit="handleOTPVerification(event)">
                    <div class="otp-inputs">
                        <input type="text" id="otp1" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp2')" onkeydown="moveToPrev(this, null, event)">
                        <input type="text" id="otp2" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp3')" onkeydown="moveToPrev(this, 'otp1', event)">
                        <input type="text" id="otp3" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp4')" onkeydown="moveToPrev(this, 'otp2', event)">
                        <input type="text" id="otp4" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp5')" onkeydown="moveToPrev(this, 'otp3', event)">
                        <input type="text" id="otp5" maxlength="1" class="otp-input" oninput="moveToNext(this, 'otp6')" onkeydown="moveToPrev(this, 'otp4', event)">
                        <input type="text" id="otp6" maxlength="1" class="otp-input" oninput="moveToNext(this, null)" onkeydown="moveToPrev(this, 'otp5', event)">
                    </div>
                    
                    <div class="otp-timer">
                        <p>Kode akan kedaluwarsa dalam <span id="timer">05:00</span></p>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="verifyBtn">Verifikasi OTP</button>
                </form>
                
                <div class="auth-links">
                    <a href="#" onclick="resendOTP()" id="resendLink" style="display: none;">Kirim ulang kode OTP</a>
                    <a href="index.html">Kembali ke Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script>
        let otpData = null;
        let timerInterval = null;
        let timeLeft = 300; // 5 minutes

        document.addEventListener('DOMContentLoaded', function() {
            // Get OTP data from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const token = urlParams.get('token');
            
            if (!email || !token) {
                showMessage('Link tidak valid!', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }
            
            // Display email
            document.getElementById('emailDisplay').textContent = email;
            
            // Store OTP data
            otpData = { email, token };
            
            // Start timer
            startTimer();
            
            // Focus first input
            document.getElementById('otp1').focus();
        });

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = '00:00';
                    document.getElementById('verifyBtn').disabled = true;
                    document.getElementById('resendLink').style.display = 'block';
                    showMessage('Kode OTP telah kedaluwarsa!', 'error');
                }
            }, 1000);
        }

        function moveToNext(current, nextId) {
            if (current.value.length === 1 && nextId) {
                document.getElementById(nextId).focus();
            }
            
            // Auto submit when all fields filled
            if (current.id === 'otp6' && current.value.length === 1) {
                setTimeout(() => {
                    const form = document.querySelector('form');
                    if (form) {
                        form.dispatchEvent(new Event('submit'));
                    }
                }, 100);
            }
        }

        function moveToPrev(current, prevId, event) {
            if (event.key === 'Backspace' && current.value.length === 0 && prevId) {
                document.getElementById(prevId).focus();
            }
        }

        function handleOTPVerification(event) {
            event.preventDefault();
            
            // Get OTP value
            let otp = '';
            for (let i = 1; i <= 6; i++) {
                const value = document.getElementById(`otp${i}`).value;
                if (!value) {
                    showMessage('Masukkan semua digit OTP!', 'error');
                    return;
                }
                otp += value;
            }
            
            console.log('OTP entered:', otp); // Debug log
            
            // Show loading
            const submitBtn = document.getElementById('verifyBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loading"></div> Memverifikasi...';
            submitBtn.disabled = true;
            
            // Verify OTP
            setTimeout(() => {
                const users = db.getUsers();
                const user = users.find(u => 
                    u.email === otpData.email && 
                    u.otpCode === otp && 
                    u.otpToken === otpData.token
                );
                
                console.log('User found:', user); // Debug log
                
                if (user && user.otpExpiry && new Date() < new Date(user.otpExpiry)) {
                    // OTP valid, redirect to reset password
                    showMessage('OTP berhasil diverifikasi!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = `reset-password.html?token=${user.resetToken}`;
                    }, 1500);
                } else {
                    // OTP invalid
                    showMessage('Kode OTP salah atau sudah kedaluwarsa!', 'error');
                    
                    // Clear inputs
                    for (let i = 1; i <= 6; i++) {
                        document.getElementById(`otp${i}`).value = '';
                    }
                    document.getElementById('otp1').focus();
                }
                
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 1500);
        }

        function resendOTP() {
            if (!otpData) return;
            
            const resendLink = document.getElementById('resendLink');
            resendLink.style.display = 'none';
            
            // Generate new OTP
            const newOTP = generateOTP();
            const newToken = generateToken();
            
            // Update user with new OTP
            const users = db.getUsers();
            const userIndex = users.findIndex(u => u.email === otpData.email);
            
            if (userIndex !== -1) {
                users[userIndex].otpCode = newOTP;
                users[userIndex].otpToken = newToken;
                users[userIndex].otpExpiry = new Date(Date.now() + 300000).toISOString(); // 5 minutes
                localStorage.setItem('users', JSON.stringify(users));
                
                // Send new OTP email
                sendOTPEmail(otpData.email, users[userIndex].name, newOTP, newToken)
                    .then(() => {
                        showMessage('Kode OTP baru telah dikirim!', 'success');
                        
                        // Reset timer
                        clearInterval(timerInterval);
                        timeLeft = 300;
                        startTimer();
                        
                        // Update token
                        otpData.token = newToken;
                        
                        // Clear inputs
                        for (let i = 1; i <= 6; i++) {
                            document.getElementById(`otp${i}`).value = '';
                        }
                        document.getElementById('otp1').focus();
                        
                        document.getElementById('verifyBtn').disabled = false;
                    })
                    .catch(() => {
                        showMessage('Gagal mengirim ulang OTP!', 'error');
                        resendLink.style.display = 'block';
                    });
            }
        }

        function generateOTP() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function generateToken() {
            return Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        }

        async function sendOTPEmail(email, name, otp, token) {
            const formData = new FormData();
            formData.append('email', email);
            formData.append('name', name);
            formData.append('subject', 'Kode OTP Reset Password - Web Catatan');
            formData.append('message', `
Halo ${name},

Kode OTP untuk reset password Anda adalah:

${otp}

Kode ini akan kedaluwarsa dalam 5 menit.

Jika Anda tidak meminta reset password, abaikan email ini.

Terima kasih,
Tim Web Catatan
            `);
            
            const response = await fetch('https://formspree.io/f/mpqdjgqa', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error('Failed to send email');
            }
            
            return response.json();
        }

        function showMessage(message, type) {
            const existingMessages = document.querySelectorAll('.message');
            existingMessages.forEach(msg => msg.remove());
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            const form = document.getElementById('otpForm');
            form.insertBefore(messageDiv, form.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Prevent paste of non-numeric characters
        document.addEventListener('paste', function(event) {
            if (event.target.classList.contains('otp-input')) {
                event.preventDefault();
                const paste = (event.clipboardData || window.clipboardData).getData('text');
                const numbers = paste.replace(/\D/g, '').slice(0, 6);
                
                for (let i = 0; i < numbers.length && i < 6; i++) {
                    document.getElementById(`otp${i + 1}`).value = numbers[i];
                }
                
                if (numbers.length === 6) {
                    setTimeout(() => {
                        document.querySelector('form').dispatchEvent(new Event('submit'));
                    }, 100);
                }
            }
        });

        // Only allow numbers
        document.addEventListener('input', function(event) {
            if (event.target.classList.contains('otp-input')) {
                event.target.value = event.target.value.replace(/\D/g, '');
            }
        });
    </script>
</body>
</html>
