<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Catatan - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-sticky-note"></i> Web Catatan</h1>
                <p>Kelola catatan Anda dengan mudah</p>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <h2>Masuk</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button type="submit" class="btn-primary">Masuk</button>
                </form>
                <div class="auth-links">
                    <a href="#" onclick="showForgotPassword()">Lupa Password?</a>
                    <a href="#" onclick="showRegister()">Belum punya akun? Daftar</a>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form">
                <h2>Daftar</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <input type="text" id="registerName" placeholder="Nama Lengkap" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="form-group">
                        <input type="email" id="registerEmail" placeholder="Email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="form-group">
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button type="submit" class="btn-primary">Daftar</button>
                </form>
                <div class="auth-links">
                    <a href="#" onclick="showLogin()">Sudah punya akun? Masuk</a>
                </div>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgotForm" class="auth-form">
                <h2>Lupa Password</h2>
                <p>Masukkan email Anda untuk reset password</p>
                <form onsubmit="handleForgotPassword(event)">
                    <div class="form-group">
                        <input type="email" id="forgotEmail" placeholder="Email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <button type="submit" class="btn-primary">Kirim Link Reset</button>
                </form>
                <div class="auth-links">
                    <a href="#" onclick="showLogin()">Kembali ke Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="auth.js"></script>
</body>
</html>
